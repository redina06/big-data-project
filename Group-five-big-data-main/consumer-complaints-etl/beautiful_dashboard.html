<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Consumer Complaints Analytics Dashboard</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f172a; color: #e0f2fe; margin: 0; padding: 20px; }
        h1 { text-align: center; color: #67e8f9; }
        .kpi { display: flex; justify-content: center; gap: 20px; margin: 30px 0; flex-wrap: wrap; }
        .card { background: #1e2937; padding: 20px; border-radius: 12px; width: 220px; text-align: center; }
        .value { font-size: 2.5rem; font-weight: bold; color: #67e8f9; }
        .chart-container { background: #1e2937; padding: 20px; border-radius: 12px; margin: 20px 0; }
        .title { text-align: center; color: #a5f3fc; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h1>Consumer Complaints Analytics Dashboard</h1>
    <p style="text-align:center; color:#94a3b8;">Powered by Apache Spark</p>

    <div class="kpi">
        <div class="card"><div class="value">62,516</div><div>TOTAL COMPLAINTS</div></div>
        <div class="card"><div class="value">51</div><div>STATES</div></div>
        <div class="card"><div class="value">9</div><div>PRODUCTS</div></div>
        <div class="card"><div class="value">4.1.1</div><div>SPARK VERSION</div></div>
    </div>

    <div class="chart-container"><div class="title">Complaints by State (Top 15)</div><div id="state" style="height:400px"></div></div>
    <div class="chart-container"><div class="title">Complaints by Product (Top 10)</div><div id="product" style="height:400px"></div></div>
    <div class="chart-container"><div class="title">Complaints by Issue (Top 10)</div><div id="issue" style="height:400px"></div></div>
    <div class="chart-container"><div class="title">Timely Response</div><div id="timely" style="height:400px"></div></div>

    <script>
        console.log("🚀 Dashboard JS loaded");

        const layout = {
            paper_bgcolor: "#1e2937",
            plot_bgcolor: "#1e2937",
            font: {color: "#e0f2fe"},
            margin: {l:50, r:30, t:40, b:70}
        };

        // State Chart
        Plotly.newPlot('state', [{
            x: ["CA", "FL", "TX", "NY", "GA", "NJ", "IL", "MA", "MD", "VA", "NC", "PA", "WA", "AZ", "MI"],
            y: [13709, 6488, 4686, 4442, 2921, 2664, 2270, 2141, 1959, 1731, 1717, 1676, 1530, 1516, 1395],
            type: 'bar',
            marker: {color: '#67e8f9'}
        }], layout);

        // Product Chart
        Plotly.newPlot('product', [{
            x: [24814, 16197, 7710, 6601, 3453, 2736, 633, 333, 39],
            y: ["Checking or savings account", "Credit card or prepaid card", "Credit reporting, credit repair services, or other personal consumer reports", "Mortgage", "Money transfer, virtual currency, or money service", "Debt collection", "Vehicle loan or lease", "Payday loan, title loan, or personal loan", "Student loan"],
            type: 'bar',
            orientation: 'h',
            marker: {color: '#22d3ee'}
        }], layout);

        // Issue Chart
        Plotly.newPlot('issue', [{
            x: ["Managing an account", "Incorrect information on your report", "Problem with a purchase shown on your statement", "Closing an account", "Trouble during payment process", "Opening an account", "Problem with a lender or other company charging your account", "Fraud or scam", "Struggling to pay mortgage", "Problem with a credit reporting company's investigation into an existing problem"],
            y: [15109, 4931, 4415, 2953, 2827, 2725, 2493, 1987, 1904, 1876],
            type: 'bar',
            marker: {color: '#67e8f9'}
        }], layout);

        // Timely Response
        Plotly.newPlot('timely', [{
            labels: ["Unknown", "No", "Yes"],
            values: [1494, 2403, 58619],
            type: 'pie',
            hole: 0.6
        }], layout);

        console.log("✅ All charts rendered!");
    </script>
</body>
</html>
